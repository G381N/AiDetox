<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Grid Task - Desktop Layout</title>
        <style>
        body {
            display: grid;
            grid-template-areas:
                "header main widget"
                "header footer widget";
            grid-template-columns: 220px 1fr 300px;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        div{
            height: 700px;
        }
        .site-header {
            grid-area: header;
            background-color: #33f8ff;
        }
        .site-main {
            grid-area: main;
            background-color: #20df59;
        }
        .widget-area {
            grid-area: widget;
            background-color: #c715f3;
        }
        .site-footer {
            grid-area: footer;
            background-color: #0077ff;
        }

        @media (min-width: 600px) and (max-width: 999px) {
            body {
                grid-template-areas:
                    "header main"
                    "header widget"
                    "footer footer";
                grid-template-columns: 220px 1fr;
                grid-template-rows: auto 1fr auto;
                height: 100vh;
            }
        }
        @media (max-width: 499px) {
            body {
                grid-template-areas:
                    "header"
                    "main"
                    "widget"
                    "footer";
            }
            
        }
        </style>
    </head>
        <body>
            <div class="site-header"></div>
            <div class="site-main"></div>
            <div class="widget-area"></div>
            <div class="site-footer"></div>
        </body>
</html>
