<!-- Task:
Create a User Directory web page that fetches user data from a public API using the Fetch API with async/await, converts and reads the JSON response, dynamically displays user details (name, email, city) on the page, shows a loading message while fetching, displays an error message if the API fails, and includes a search input to filter users by name or email without making another API call.
🔗 API to Use
https://jsonplaceholder.typicode.com/users  -->
<!DOCTYPE html>
<html>

<head>
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css" />
        
</head>

<body>
    <div class="container">
        <h1>User Directory</h1>
        <input type="text" id="search" placeholder="Search by name or email..." />
        <div id="loading">Loading users...</div>
        <div id="error"></div>
        <div id="user-list"></div>

    <script>
        //Reference to DOM elements
        const userList = document.getElementById('user-list');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const searchInput = document.getElementById('search');

        //Declare users array
        let users = [];

        //Fetch users from API
        async function fetchUsers() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                users = await response.json();
                displayUsers(users);
            } catch (err) {
                error.textContent = 'Failed to load users. Please try again later.';
                loading.style.display = 'none';
            }
        }

        //Display users on the page
        function displayUsers(users) {
            loading.style.display = 'none';
            userList.innerHTML = '';
            users.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.innerHTML = `
                        <h2>${user.name}</h2>
                        <p>Email: ${user.email}</p>
                        <p>City: ${user.address.city}</p>
                    `;
                userList.appendChild(userDiv);
            });
        }

        //Filter users based on search input
        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredUsers = users.filter(user =>
                user.name.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm)
            );
            displayUsers(filteredUsers);
        });

        //Initial fetch of users
        fetchUsers();
    </script>
    </div>
</body>
</html>
