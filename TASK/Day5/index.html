<!DOCTYPE html>
<html>

<head>
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css" />
        
</head>

<body>
    <div class="container">
        <h1>User Directory</h1>
        <input type="text" id="search" placeholder="Search by name or email..." />
        <div id="loading">Loading users...</div>
        <div id="error"></div>
        <div id="user-list"></div>

    <script>
        // === Simple, readable User Directory script ===

        // DOM references
        const userList = document.getElementById('user-list');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const searchInput = document.getElementById('search');

        // State
        let users = [];
        const API_URL = 'https://jsonplaceholder.typicode.com/users';

        // Utility UI helpers
        function showLoading(message = 'Loading users...') {
            loading.textContent = message;
            loading.style.display = 'block';
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function showError(msg) {
            error.textContent = msg;
            error.style.display = 'block';
        }

        function clearError() {
            error.textContent = '';
            error.style.display = 'none';
        }

        // Wrap the fetch in an explicit Promise for clarity
        function getUsersFromApi() {
            return new Promise((resolve, reject) => {
                fetch(API_URL)
                    .then(response => {
                        if (!response.ok) {
                            reject(new Error(`API responded with status ${response.status}`));
                            return;
                        }
                        return response.json();
                    })
                    .then(data => resolve(data))
                    .catch(err => reject(err));
            });
        }

        // Load users and render; uses the Promise-based helper above
        function loadUsers() {
            showLoading();
            clearError();

            getUsersFromApi()
                .then(data => {
                    users = Array.isArray(data) ? data : [];
                    displayUsers(users);
                })
                .catch(err => {
                    console.error('Failed to fetch users:', err);
                    showError('Failed to load users. Please try again later.');
                    hideLoading();
                });
        }

        // Render list of users
        function displayUsers(list) {
            hideLoading();
            clearError();
            userList.innerHTML = '';

            if (!list || list.length === 0) {
                userList.innerHTML = '<div class="user">No users found.</div>';
                return;
            }

            list.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.innerHTML = `
                    <h2>${escapeHtml(user.name)}</h2>
                    <p>Email: ${escapeHtml(user.email)}</p>
                    <p>City: ${escapeHtml(user.address?.city || '')}</p>
                `;
                userList.appendChild(userDiv);
            });
        }

        // Basic HTML-escape to avoid accidental injection when rendering
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        // Search/filter functionality (client-side)
        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim().toLowerCase();
            if (!term) {
                displayUsers(users);
                return;
            }

            const filtered = users.filter(u => {
                const name = (u.name || '').toLowerCase();
                const email = (u.email || '').toLowerCase();
                return name.includes(term) || email.includes(term);
            });

            displayUsers(filtered);
        });

        // Kick things off
        loadUsers();
    </script>
    </div>
</body>
</html>
