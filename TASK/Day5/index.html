<!DOCTYPE html>
<html>

<head>
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css" />

</head>

<body>
    <div class="container">
        <h1>User Directory</h1>
        <input type="text" id="search" placeholder="Search by name or email..." />
        <div id="loading">Loading users...</div>
        <div id="error"></div>
        <div id="user-list"></div>

        <script>
            //Reference to DOM elements
            const userList = document.getElementById('user-list');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const searchInput = document.getElementById('search');

            //Declare users array
            let users = [];


            // Wihout promise
            // //Fetch users from API
            // async function fetchUsers() {
            //     try {
            //         const response = await fetch('https://jsonplaceholder.typicode.com/users');
            //         if (!response.ok) {
            //             throw new Error('Network response was not ok');
            //         }
            //         users = await response.json();
            //         displayUsers(users);
            //     } catch (err) {
            //         error.textContent = 'Failed to load users. Please try again later.';
            //         loading.style.display = 'none';
            //     }
            // }


            function fetchUsers() {
                fetch('https://jsonplaceholder.typicode.com/users')
                    .then(httpResponse => {
                        if (!httpResponse.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return httpResponse.json();
                    })
                    .then(parsedUsersData => {
                        users = parsedUsersData;
                        displayUsers(users);
                    })
                    .catch(err => {
                        error.textContent = 'Failed to load users. Please try again later.';
                        loading.style.display = 'none';
                    })
                    .finally(() => {
                        console.log('Fetch users promise completed');
                    });
            }


            //Display users on the page
            function displayUsers(users) {
                loading.style.display = 'none';
                userList.innerHTML = '';
                users.forEach(user => {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user';
                    userDiv.innerHTML = `
                        <h2>${user.name}</h2>
                        <p>Email: ${user.email}</p>
                        <p>City: ${user.address.city}</p>
                    `;
                    userList.appendChild(userDiv);
                });
            }

            //Filter users based on search input
            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase();
                const filteredUsers = users.filter(user =>
                    user.name.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm)
                );
                displayUsers(filteredUsers);
            });

            //Initial fetch of users
            fetchUsers();
        </script>
    </div>
</body>

</html>
