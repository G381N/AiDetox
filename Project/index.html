<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Gebin's Form - A retro-styled registration and login system">
    <meta name="theme-color" content="#0f172a">
    <title>Gebin's Form - Register & Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="main-title">Gebin's <br>Form</div>
    <div class="retro-container">
        <div class="retro-header">
            <span class="header-text">REGISTER.EXE</span>
            <div class="controls">
                <span class="min" role="button" aria-label="Minimize"></span>
                <span class="max" role="button" aria-label="Maximize"></span>
                <span class="close" role="button" aria-label="Close"></span>
            </div>
        </div>
        <div class="retro-content">
            <div class="tabs" role="tablist">
                <button type="button" class="tab-btn active" id="tab-register" onclick="switchTab('register')" role="tab" aria-selected="true">Register</button>
                <button type="button" class="tab-btn" id="tab-login" onclick="switchTab('login')" role="tab" aria-selected="false">Login</button>
            </div>
            <h1 id="formTitle">Register</h1>
            <form id="registrationForm" onsubmit="return validateForm()" novalidate>
                <div id="successMessage" class="success-message"></div>
                <div id="nameGroup">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name">
                    <div id="nameError" class="error" role="alert"></div>
                </div>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Enter your email" autocomplete="email">
                <div id="emailError" class="error" role="alert"></div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password">
                <div id="passwordError" class="error" role="alert"></div>
                <div id="confirmPasswordGroup">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
                    <div id="confirmPasswordError" class="error" role="alert"></div>
                </div>
                <div id="socialLoginGroup" class="social-group" style="display: none;">
                    <div class="divider">OR</div>
                    <div class="social-btn-container">
                        <button type="button" class="social-btn google-btn" aria-label="Sign in with Google">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                            Google
                        </button>
                        <button type="button" class="social-btn github-btn" aria-label="Sign in with GitHub">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.419-1.305.763-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                            GitHub
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn">Register</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
